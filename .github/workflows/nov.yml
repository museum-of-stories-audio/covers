name: nov
on:
  push:
    paths: ['.github/workflows/nov.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          curl -fsSL --retry 3 -o nasa.jpg https://pomf2.lain.la/f/kgiz2pok.jpg
          curl -fsSL --retry 3 -o after.jpg https://pomf2.lain.la/f/gblpri7w.jpg
          ls -l *.jpg | wc -l
      - name: commit
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add nasa.jpg after.jpg
          git commit -m "add novella covers"
          git push
